        <title>Legcord</title>

                style.textContent = "body { display: none; }";
                document.head.append(style);
            };
        </script>

            :root {
                --background-primary: #282b30;
                --background-secondary: rgba(255, 255, 255, 0.1);
                --brand-experiment: #7289da;
                --header-primary: #fff;
                --text-muted: #72767d;
            }

            @font-face {
                font-family: Whitney;
                font-weight: 400;
                font-style: normal;
                src: url(https://legcord.app/whitney_400.woff) format("woff");
            }

            html,
            body {
                -webkit-app-region: drag;
                overflow: hidden;
                margin: 0;
                padding: 0;
                width: 100%;
                height: 100%;
                background: var(--background-primary);
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
            }

            * {
                font-family: "Whitney", sans-serif;
                box-sizing: border-box;
                -webkit-user-select: none;
                user-select: none;
                cursor: default;
            }

            video {
                display: block;
                width: 200px;
                height: 150px;
                object-fit: cover;
                margin: 0 auto;
            }

            #text-splashscreen {
                font-size: 16px;
                text-align: center;
                color: var(--header-primary);
                font-weight: 400;
                font-style: italic;
                text-transform: uppercase;
                width: 100%;
            }

            #launch-row {
                display: none;
                flex-direction: column;
                align-items: center;
                gap: 6px;
                margin-top: 14px;
                width: 220px;
            }

            #launch-row.visible {
                display: flex;
            }

            #bar-container,
            #bar-fill {
                width: 100%;
                height: 8px;
                border-radius: 4px;
            }

            #bar-container {
                background-color: var(--background-secondary);
                overflow: hidden;
            }

            #bar-fill {
                background-color: var(--brand-experiment);
                width: 0;
                transition:
                    width 0.3s ease,
                    background-color 0.3s ease;
            }

            #launch-status {
                font-size: 12px;
                text-align: center;
                color: var(--text-muted);
                line-height: 1.4;
                white-space: pre-wrap;
                min-height: 17px;
                word-break: break-word;
            }

            #launch-row.ok #bar-fill {
                background-color: #3ba55d;
            }

            #launch-row.error #bar-fill {
                background-color: #ed4245;
            }

            #actions {
                display: none;
                flex-direction: column;
                gap: 8px;
                margin-top: 12px;
                width: 220px;
            }

            #actions.visible {
                display: flex;
            }

            #actions button {
                display: block;
                width: 100%;
            }

            #debug {
                position: absolute;
                bottom: 6px;
                right: 6px;
                text-align: right;
                font-size: 10px;
                color: var(--text-muted);
                white-space: pre;
            }

            #bypass {
                display: none;
                flex-direction: column;
                align-items: center;
                gap: 8px;
                margin-top: 16px;
                padding: 0 12px;
            }

            #bypass.visible {
                display: flex;
            }

            #bypass-detail {
                font-size: 12px;
                text-align: center;
                color: var(--text-muted);
                line-height: 1.4;
                min-height: 34px;
            }

            .spinner {
                width: 26px;
                height: 26px;
                border-radius: 50%;
                border: 3px solid var(--background-secondary);
                border-top-color: var(--brand-experiment);
                animation: spin 0.9s linear infinite;
            }

            #bypass.done .spinner {
                animation: none;
                border-top-color: #3ba55d;
                transform: rotate(0deg);
            }

            #bypass.error .spinner {
                animation: none;
                border-top-color: #ed4245;
                transform: rotate(0deg);
            }

            @keyframes spin {
                to {
                    transform: rotate(360deg);
                }
            }

            img.logo {
                width: 272px;
            }

            button {
                background: var(--brand-experiment);
                color: var(--header-primary);
                outline: none;
                border: none;
                border-radius: 5px;
                padding: 8px;
                -webkit-user-select: all;
                user-select: all;
                margin: 0 auto;
                margin-top: 10px;
                -webkit-app-region: no-drag;
                transition: 0.17s ease;
                display: none;
            }
            button:hover {
                cursor: grab;
            }

        </style>
    </head>

    <body>
        <div class="container">
            <!-- biome-ignore lint/a11y/useMediaCaption: silent logo animation, no audio -->
            <video autoplay loop class="logo" id="splashscreen-legcord">
                <source src="legcord://assets/Loading.webm" type="video/webm" />
            </video>
            <p id="text-splashscreen"></p>
            <div id="bypass">
                <div class="spinner"></div>
                <p id="bypass-detail"></p>
            </div>
            <div id="launch-row">
                <div id="bar-container"><div id="bar-fill"></div></div>
                <p id="launch-status"></p>
            </div>
            <div id="actions">
                <button id="retry" type="button">Retry</button>
                <button id="ignore" type="button">Start anyway</button>
            </div>
        </div>
    </body>
    <script>
        (async () => {
            const text = document.getElementById("text-splashscreen");
            const bypassEl = document.getElementById("bypass");
            const bypassDetail = document.getElementById("bypass-detail");
            const launchRow = document.getElementById("launch-row");
            const barFill = document.getElementById("bar-fill");
            const launchStatus = document.getElementById("launch-status");
            const actions = document.getElementById("actions");
            const retryBtn = document.getElementById("retry");
            const ignoreBtn = document.getElementById("ignore");

            const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
            let failed = false;

            retryBtn.addEventListener("click", () => window.internal.restart());
            ignoreBtn.addEventListener("click", () => window.internal.splashEnd());

            function setPct(pct) {
                launchRow.classList.remove("error");
                barFill.style.width = `${Math.max(0, Math.min(100, pct))}%`;
                launchRow.classList.add("visible");
            }

            function setStatus(msg) {
                launchStatus.textContent = msg ?? "";
            }

            function markDone() {
                launchRow.classList.remove("error");
                launchRow.classList.add("ok", "visible");
                barFill.style.width = "100%";
                setStatus("Discord запущен");
            }

            function markError(title, detail) {
                failed = true;
                launchRow.classList.remove("ok");
                launchRow.classList.add("error", "visible");
                setStatus(detail ? `${title}\n${detail}` : title);
                actions.classList.add("visible");
            }

            function bypassPct(snapshot) {
                if (snapshot.stage === "checking") return 12;
                if (snapshot.stage === "installing") return 30;
                if (snapshot.stage === "testing") {
                    const total = snapshot.total > 0 ? snapshot.total : 1;
                    return 32 + Math.round((Math.min(snapshot.tried, total) / total) * 28);
                }
                return 0;
            }

            function renderBypass(snapshot) {
                bypassEl.classList.remove("done", "error");
                if (snapshot.stage === "active" || snapshot.stage === "direct") bypassEl.classList.add("done");
                if (snapshot.stage === "error") bypassEl.classList.add("error");
                bypassDetail.textContent = snapshot.detail || "";
                const pct = bypassPct(snapshot);
                if (pct > 0) setPct(pct);
            }

            function waitForBypass() {
                return new Promise((resolve) => {
                    if (!internal.bypass.enabled) return resolve(false);
                    bypassEl.classList.add("visible");
                    renderBypass(internal.bypass.snapshot);
                    if (["active", "direct", "error"].includes(internal.bypass.snapshot.stage)) return resolve(true);
                    const off = internal.onBypassStatus((snapshot) => {
                        renderBypass(snapshot);
                        if (["active", "direct", "error"].includes(snapshot.stage)) {
                            off();
                            resolve(true);
                        }
                    });
                    setTimeout(() => {
                        off();
                        resolve(true);
                    }, 30000);
                });
            }

            function waitForLaunch() {
                return new Promise((resolve) => {
                    const initial = internal.launch;
                    if (initial.state === "ok") return resolve(initial);
                    if (initial.state === "fail") return resolve(initial);
                    const off = internal.onLaunchStatus((status) => {
                        if (status.state === "ok" || status.state === "fail") {
                            off();
                            resolve(status);
                        }
                    });
                    setTimeout(() => {
                        off();
                        resolve({ state: "fail", detail: "Timed out while waiting for Discord" });
                    }, 60000);
                });
            }

            function check() {
                if (internal.installState === "installing") {
                    text.innerHTML = "Installing mods";
                } else if (internal.installState === "done") {
                    return true;
                } else if (internal.installState === "modDownload") {
                    text.innerHTML = `Updating ${internal.mods}`;
                } else if (internal.installState === "none") {
                    text.innerHTML = "Nothing to install.";
                    return true;
                } else {
                    return true;
                }
            }

            if (window.navigator.onLine === false) {
                for (let i = 0; i < 5; i++) {
                    await sleep(1000);
                    text.innerHTML = `${(await internal.getLang("loading_screen_offline")) + (5 - i)}s`;
                }
                window.internal.restart();
                return;
            }

            setPct(5);
            setStatus("Запуск…");
            text.innerHTML = await internal.getLang("loading_screen_start");
            if (!internal.isDev && !internal.isMicrosoftStore) {
                setStatus("Проверка обновлений…");
                const controller = new AbortController();
                const timer = setTimeout(() => controller.abort(), 8000);
                try {
                    const response = await fetch("https://legcord.app/latest.json", { signal: controller.signal });
                    const data = await response.json();
                    const remoteVersion = data.version.replace(/\./g, "");
                    if (remoteVersion > window.internal.version.replace(/\./g, "")) {
                        const elem = document.createElement("img");
                        elem.classList.add("logo");
                        elem.src = "legcord://assets/Update.webp";
                        document.body.prepend(elem);
                        document.getElementById("splashscreen-legcord").remove();
                        text.innerHTML = await internal.getLang("loading_screen_update");
                    }
                } catch (_e) {
                    console.warn("Update check failed; continuing startup.");
                } finally {
                    clearTimeout(timer);
                }
            }

            while (check() === false) await sleep(10);
            setPct(55);
            setStatus("Готовим запуск…");

            const bypassTerminal = await waitForBypass();
            if (failed) return;

            if (bypassTerminal && internal.bypass.snapshot.stage === "error") {
                setStatus(internal.bypass.snapshot.detail || "Обход не удался");
            }
            setPct(70);
            setStatus("Загрузка Discord…");

            const outcome = await waitForLaunch();
            if (outcome.state === "ok") {
                markDone();
                await sleep(900);
                window.internal.splashEnd();
            } else {
                markError("Discord не запустился", outcome.detail);
            }
        })();
    </script>
</html>
